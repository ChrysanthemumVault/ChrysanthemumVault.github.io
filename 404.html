<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Not Found — Chrysanthemum Vault</title>
<meta name="robots" content="noindex"/>
<link rel="icon" href="assets/images/favicon.png" type="image/png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Cormorant+Garamond:wght@400&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a0c0f;color:#c9a133;font-family:'Cormorant Garamond',serif}
.wrap{
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:24px;
}
.frame{
  position:relative;border:1px solid rgba(201,161,51,0.32);
  padding:64px 48px;max-width:560px;width:100%;
}
.frame::before,.frame::after,.fc::before,.fc::after{
  content:'';position:absolute;width:16px;height:16px;
  border-color:#c9a133;border-style:solid;
}
.frame::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
.frame::after{top:-1px;right:-1px;border-width:2px 2px 0 0}
.fc::before{bottom:-1px;left:-1px;border-width:0 0 2px 2px}
.fc::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.fc{position:absolute;inset:0;pointer-events:none}
h1{font-family:'Cinzel',serif;font-weight:400;font-size:15px;letter-spacing:0.38em;color:#e8c97a;margin:22px 0 14px}
p{font-size:18px;line-height:1.8;color:rgba(201,161,51,0.68);margin-bottom:28px}
a{
  display:inline-block;font-family:'Cinzel',serif;font-size:10px;letter-spacing:0.28em;
  color:#c9a133;border:1px solid #c9a133;padding:12px 28px;
  text-decoration:none;transition:all .25s;
}
a:hover{background:#c9a133;color:#080a0d}
.dot{font-size:10px;color:#7a5e1a}
</style>
</head>
<body>
<div class="wrap">
  <div class="frame">
    <div class="fc"></div>
    <span class="dot">✦</span>
    <h1>THIS DOOR OF THE VAULT DOES NOT EXIST</h1>
    <p>The page you seek is not among the collection.</p>
    <a href="/">RETURN TO THE VAULT</a>
  </div>
</div>
</body>
</html>
